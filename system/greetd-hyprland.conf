# Hyprland-instansen som bara finns för att rita greetern. När regreet stänger
# (efter lyckad inloggning) avslutas Hyprland, och greetd startar den riktiga
# sessionen.

# Samma läge och skala som laptopScaleSolo i hypr/hyprland.lua. Utan den här
# raden ritas regreet oskalat på 2560x1600 och texten blir liten.
monitor = eDP-1, 2560x1600@165, 0x0, 1.25

exec-once = regreet; hyprctl dispatch exit
