options nvidia-drm modeset=1
options nvidia NVreg_DynamicPowerManagement=0x02
# NVreg_PreserveVideoMemoryAllocations sätts medvetet INTE här. Med nvidia-open
# är NVreg_UseKernelSuspendNotifiers=1 default, och då sparar drivrutinen VRAM
# över suspend automatiskt. Att tvinga =1 byter till den äldre mekanismen som
# kräver nvidia-suspend/-resume.service och kopierar hela grafikminnet till en
# backing store vid varje suspend - onödigt långsamt. Se
# /usr/share/doc/nvidia/html/powermanagement.html
