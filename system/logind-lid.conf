# Viloläge när locket stängs, även med extern skärm inkopplad.
# logind räknar datorn som dockad så fort en extern skärm sitter i, och
# standardvärdet för HandleLidSwitchDocked är ignore - då händer ingenting när
# locket stängs och MSI:n/TV:n fortsätter lysa. Nackdelen: det går inte att
# köra med stängt lock mot en extern skärm.
[Login]
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=suspend
HandleLidSwitchDocked=suspend
