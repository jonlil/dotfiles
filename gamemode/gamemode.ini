# GameMode-konfiguration. Läses från ~/.config/gamemode.ini.
#
# Hela poängen med [custom] här är att launch-kommandot i Steam inte behöver
# veta något om effektprofiler - gamemode anropar hookarna själv när spelet
# registrerar sig, och igen när det avslutas. Kräver bara gamemoderun.

[general]
# Låt power-profiles-daemon äga cpufreq ensamt.
#
# GameModes default är desiredgov=performance. På intel_pstate active mode blir
# energy_performance_preference skrivskyddad när governorn är performance, och
# då failar PPD:s profilbyte med "Device or resource busy (26)" - alltså slår
# gamemode ut hooken nedan. PPD håller istället governorn på powersave och
# växlar EPP: balance_performance -> performance. Samma effekt, ingen konflikt.
desiredgov=powersave
defaultgov=powersave

[custom]
start=/home/jonas/.local/bin/game-power start
end=/home/jonas/.local/bin/game-power end
