# Låsskärm i Catppuccin Mocha, samma palett som waybar, eww, mako och greetern.
#
# Bakgrunden (lockscreen.jpg) är genererad, inte nedladdad - den ligger i repot
# så låsskärmen ser likadan ut på en ny maskin. Receptet finns i
# scripts/gen-lockscreen-bg om du vill ändra färger eller komposition.

background {
    monitor =
    path = ~/.config/hypr/lockscreen.jpg
    # Lätt blur ovanpå den redan mjuka gradienten ger djup bakom texten utan
    # att färgerna blir gröt.
    blur_passes = 2
    blur_size = 4
    noise = 0.011
    contrast = 1.0
    brightness = 0.85
    vibrancy = 0.17
}

general {
    disable_loading_bar = true
    no_fade_in = true
    no_fade_out = true
    hide_cursor = true
}

# Klockan. Tunn och stor - den ska gå att läsa på håll utan att skrika.
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgb(cdd6f4)
    font_size = 120
    font_family = JetBrainsMono Nerd Font ExtraLight
    position = 0, 300
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 6
    shadow_color = rgba(11111baa)
}

# Datum, dämpat under klockan.
label {
    monitor =
    # LC_TIME explicit: systemets LANG är en_US, men datumet ska vara svenskt
    # (samma val som i system/regreet.toml).
    text = cmd[update:60000] LC_TIME=sv_SE.UTF-8 date +"%A %-d %B"
    color = rgb(a6adc8)
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, 190
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(11111baa)
}

label {
    monitor =
    text = Hej, $USER
    color = rgb(cdd6f4)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 30
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 340, 54
    outline_thickness = 2
    rounding = 16
    dots_size = 0.28
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(45475aaa)
    inner_color = rgba(1e1e2ecc)
    font_color = rgb(cdd6f4)
    check_color = rgb(89b4fa)
    fail_color = rgb(f38ba8)
    fail_text = <i>Fel lösenord</i>
    fade_on_empty = false
    placeholder_text = <i>Lösenord...</i>
    hide_input = false
    position = 0, -60
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(11111b99)
}

# Batteri längst ner - praktiskt att se innan man låser upp en laptop.
label {
    monitor =
    text = cmd[update:30000] printf "%s%%  %s" "$(cat /sys/class/power_supply/BAT0/capacity)" "$(cat /sys/class/power_supply/BAT0/status)"
    color = rgb(a6adc8)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, 50
    halign = center
    valign = bottom
}
