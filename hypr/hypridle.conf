general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    # Med Lua-configen tar hyprctl dispatch ett Lua-uttryck, inte den gamla
    # "dpms off"-syntaxen. Den gamla formen ger ett parsefel (exit 7) som
    # hypridle sväljer tyst, och skärmarna förblir tända.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# Lås efter 15 min
listener {
    timeout = 900
    on-timeout = loginctl lock-session
}

# Stäng av skärm 5 min efter låset
listener {
    timeout = 1200
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}
